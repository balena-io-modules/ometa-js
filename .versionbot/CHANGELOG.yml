- version: 1.5.3
  date: 2018-08-16T22:36:07Z
  commits:
    - hash: 48631730d427ebeb1a8de995ffba081903ff2157
      author: aneilbaboo
      subject: Add bare module option
      body: |-
        `ometajs -b` strips the AMD / CommonJS wrapper from the output.
        This wrapper interferes with webpack packaging.
    - hash: d1c3bed7882bafe299550c3a11579f04b0fdd750
      author: aneilbaboo
      subject: Check whether require.extensions is available before modifying it
      body: |-
        The ometa output module relies transitively on api.js. In webpack
        environments, require or require.extension may not be defined.
        This results in failure to load api.js inside webpack.
        This change fixes the problem.
