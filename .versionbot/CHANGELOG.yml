- commits:
    - subject: Use try/catch directly instead of using `lookup`
      hash: c2d10eaf95bf3b7a426202f4dffd475810e3ceae
      body: |
        When the `lookup` function was introduced try/catch containing
        functions would not be optimized and so the indirection was a big win,
        however that is no longer an issue and creating the closures becomes a
        bigger cost, so removing those closure creations results in a
        performance win
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
